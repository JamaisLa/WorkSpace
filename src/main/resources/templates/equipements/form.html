<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title th:text="${modification ? 'Modifier un équipement' : 'Ajouter un équipement'}">Équipement</title>
</head>
<body class="ws-body">
<th:block th:replace="~{fragments/navigation :: header(true, 'equipements')}"></th:block>

<main id="contenu" tabindex="-1" class="ws-page max-w-ws-form">
    <a th:href="${modification} ? @{/equipements/{id}(id=${equipementId})} : @{/equipements}" class="ws-link-inline text-sm">Retour</a>
    <h1 class="ws-page-title" th:text="${modification ? 'Modifier l’équipement' : 'Ajouter un équipement'}"></h1>
    <form method="post"
          th:action="${modification} ? @{/equipements/{id}(id=${equipementId})} : @{/equipements}"
          th:object="${equipementForm}" class="ws-panel grid gap-5 p-6 sm:p-8">
        <div th:if="${#fields.hasGlobalErrors()}" role="alert" class="ws-alert">
            <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
        </div>
        <div>
            <label for="nom" class="ws-label">Nom (obligatoire)</label>
            <input id="nom" th:field="*{nom}" class="ws-field" th:errorclass="ws-field-invalid" required maxlength="100">
            <p th:errors="*{nom}" class="ws-field-error"></p>
        </div>
        <div>
            <label for="reference" class="ws-label">Référence unique (obligatoire)</label>
            <input id="reference" th:field="*{reference}" class="ws-field" th:errorclass="ws-field-invalid" required maxlength="100">
            <p th:errors="*{reference}" class="ws-field-error"></p>
        </div>
        <div>
            <label for="typeEquipementId" class="ws-label">Type (obligatoire)</label>
            <select id="typeEquipementId" th:field="*{typeEquipementId}" class="ws-field" th:errorclass="ws-field-invalid" required>
                <option value="">Choisir un type</option>
                <option th:each="type : ${types}" th:value="${type.id}" th:text="${type.nom}"></option>
            </select>
            <p th:errors="*{typeEquipementId}" class="ws-field-error"></p>
        </div>
        <div>
            <label for="mobilite" class="ws-label">Installation (obligatoire)</label>
            <select id="mobilite" th:field="*{mobilite}" class="ws-field" th:errorclass="ws-field-invalid" required>
                <option value="">Choisir une option</option>
                <option th:each="option : ${mobilites}" th:value="${option}" th:text="${option.libelle}"></option>
            </select>
            <p th:errors="*{mobilite}" class="ws-field-error"></p>
        </div>
        <div>
            <label for="salleId" class="ws-label">Salle (obligatoire si l’équipement est fixe)</label>
            <select id="salleId" th:field="*{salleId}" class="ws-field" th:errorclass="ws-field-invalid">
                <option value="">Aucune salle</option>
                <option th:each="salle : ${salles}" th:value="${salle.id}" th:text="${salle.nom}"></option>
            </select>
            <p th:errors="*{salleId}" class="ws-field-error"></p>
            <p th:if="${#fields.hasErrors('salleValide')}" th:errors="*{salleValide}" class="ws-field-error"></p>
        </div>
        <div class="ws-actions border-t border-ws-line pt-6">
            <button type="submit" class="ws-pill ws-pill-primary" th:text="${modification ? 'Enregistrer' : 'Créer l’équipement'}"></button>
            <a th:href="${modification} ? @{/equipements/{id}(id=${equipementId})} : @{/equipements}" class="ws-pill ws-pill-secondary">Annuler</a>
        </div>
    </form>
</main>
</body>
</html>

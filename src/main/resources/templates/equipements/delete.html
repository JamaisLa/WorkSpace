<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Supprimer un équipement</title>
</head>
<body class="ws-body">
<th:block th:replace="~{fragments/navigation :: header(true, 'equipements')}"></th:block>

<main id="contenu" tabindex="-1" class="ws-page max-w-ws-form">
    <a th:href="@{/equipements/{id}(id=${equipement.id})}" class="ws-link-inline text-sm">Retour à l’équipement</a>
    <h1 class="ws-page-title">Supprimer cet équipement ?</h1>
    <section class="ws-panel p-6 sm:p-8" aria-label="Confirmation de suppression">
        <p class="leading-7 text-ws-muted">
            Vous allez supprimer <strong class="text-ws-ink" th:text="${equipement.nom}"></strong>.
            Cette action est définitive.
        </p>
        <form method="post" th:action="@{/equipements/{id}/supprimer(id=${equipement.id})}"
              class="mt-7 ws-actions">
            <button type="submit" class="ws-pill ws-pill-secondary">Supprimer définitivement</button>
            <a th:href="@{/equipements/{id}(id=${equipement.id})}" class="ws-pill ws-pill-primary">Annuler</a>
        </form>
    </section>
</main>
</body>
</html>

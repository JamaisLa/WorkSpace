<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/salles.css}">
    <title>Supprimer un équipement</title>
</head>
<body class="site-body">
<main class="room-page max-w-2xl space-y-6">
    <a th:href="@{/equipements/{id}(id=${equipement.id})}" class="text-link text-sm">Retour à l’équipement</a>
    <h1 class="page-title">Supprimer cet équipement ?</h1>
    <section class="panel p-6 sm:p-8" aria-label="Confirmation de suppression">
        <p class="leading-7 text-slate-600">
            Vous allez supprimer <strong class="text-slate-900" th:text="${equipement.nom}"></strong>.
            Cette action est définitive.
        </p>
        <form method="post" th:action="@{/equipements/{id}/supprimer(id=${equipement.id})}"
              class="mt-7 button-row">
            <button type="submit" class="btn-danger">Supprimer définitivement</button>
            <a th:href="@{/equipements/{id}(id=${equipement.id})}" class="btn-secondary">Annuler</a>
        </form>
    </section>
</main>
</body>
</html>

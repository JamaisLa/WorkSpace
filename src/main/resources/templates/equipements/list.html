<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/salles.css}">
    <title>Équipements</title>
</head>
<body class="min-h-screen bg-slate-100 px-4 py-8 font-sans text-slate-800">
<main class="room-page space-y-7">
    <a th:href="@{/}" class="text-link text-sm">Retour à l’accueil</a>
    <p th:if="${success}" th:text="${success}" role="status" class="room-success"></p>
    <p th:if="${error}" th:text="${error}" role="alert" class="text-sm text-red-800"></p>
    <div class="flex flex-wrap items-start justify-between gap-5">
        <div>
            <h1 class="page-title">Équipements</h1>
            <p class="mt-3 text-slate-500">Consultez le matériel et son état.</p>
        </div>
        <a th:if="${admin}" th:href="@{/equipements/nouveau}" class="btn-primary">Ajouter un équipement</a>
    </div>
    <form method="get" th:action="@{/equipements}" class="panel grid gap-4 p-5 sm:grid-cols-[1fr_14rem_auto] sm:items-end">
        <div>
            <label for="q" class="field-label">Nom ou référence</label>
            <input id="q" name="q" th:value="${q}" class="field" type="search">
        </div>
        <div>
            <label for="etat" class="field-label">État</label>
            <select id="etat" name="etat" class="field">
                <option value="" th:selected="${etat == null}">Tous les états</option>
                <option th:each="option : ${etats}" th:value="${option}" th:text="${option.libelle}"
                        th:selected="${etat == option}"></option>
            </select>
        </div>
        <button type="submit" class="btn-primary">Filtrer</button>
    </form>
    <section class="panel overflow-hidden" aria-label="Liste des équipements">
        <div th:if="${!equipements.isEmpty()}" class="overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-50 text-slate-500">
                <tr>
                    <th scope="col" class="px-5 py-4 font-medium">Équipement</th>
                    <th scope="col" class="px-5 py-4 font-medium">Type</th>
                    <th scope="col" class="px-5 py-4 font-medium">Salle</th>
                    <th scope="col" class="px-5 py-4 font-medium">État</th>
                    <th scope="col" class="px-5 py-4 font-medium">Mobilité</th>
                    <th scope="col" class="px-5 py-4 font-medium">Détails</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-200">
                <tr th:each="equipement : ${equipements}">
                    <th scope="row" class="px-5 py-4 font-semibold">
                        <span th:text="${equipement.nom}"></span>
                        <span class="block text-xs font-normal text-slate-500" th:text="${equipement.reference}"></span>
                    </th>
                    <td class="px-5 py-4" th:text="${equipement.typeEquipementNom}"></td>
                    <td class="px-5 py-4" th:text="${equipement.salleNom == null ? 'Non affecté' : equipement.salleNom}"></td>
                    <td class="px-5 py-4" th:text="${equipement.etat.libelle}"></td>
                    <td class="px-5 py-4" th:text="${equipement.mobilite.libelle}"></td>
                    <td class="px-5 py-4"><a th:href="@{/equipements/{id}(id=${equipement.id})}" class="text-link">Consulter</a></td>
                </tr>
                </tbody>
            </table>
        </div>
        <p th:if="${equipements.isEmpty()}" class="p-6 text-slate-500">Aucun équipement trouvé.</p>
    </section>
</main>
</body>
</html>

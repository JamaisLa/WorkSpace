<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Équipements</title>
</head>
<body class="ws-body">
<th:block th:replace="~{fragments/navigation :: header(true, 'equipements')}"></th:block>

<main id="contenu" tabindex="-1" class="ws-page">
    <p th:if="${success}" th:text="${success}" role="status" class="ws-status"></p>
    <p th:if="${error}" th:text="${error}" role="alert" class="ws-alert"></p>
    <div class="ws-page-heading">
        <div>
            <h1 class="ws-page-title">Équipements</h1>
            <p class="mt-3 text-ws-muted">Consultez le matériel et son état.</p>
        </div>
        <a th:if="${admin}" th:href="@{/equipements/nouveau}" class="ws-pill ws-pill-primary">Ajouter un équipement</a>
    </div>
    <form method="get" th:action="@{/equipements}" class="ws-panel grid gap-4 p-5 ws-tablet:grid-cols-[minmax(0,1fr)_14rem_auto] ws-tablet:items-end">
        <div>
            <label for="q" class="ws-label">Nom ou référence</label>
            <input id="q" name="q" th:value="${q}" class="ws-field" type="search">
        </div>
        <div>
            <label for="etat" class="ws-label">État</label>
            <select id="etat" name="etat" class="ws-field">
                <option value="" th:selected="${etat == null}">Tous les états</option>
                <option th:each="option : ${etats}" th:value="${option}" th:text="${option.libelle}"
                        th:selected="${etat == option}"></option>
            </select>
        </div>
        <div class="flex flex-wrap items-center gap-ws-sm">
            <button type="submit" class="ws-pill ws-pill-secondary">Filtrer</button>
            <a th:if="${!#strings.isEmpty(q) or etat != null}" th:href="@{/equipements}" class="ws-link-inline">Effacer</a>
        </div>
    </form>
    <section class="ws-panel overflow-clip" aria-label="Liste des équipements">
        <div th:if="${!equipements.isEmpty()}">
            <table class="ws-table" role="table">
                <thead role="rowgroup">
                <tr role="row">
                    <th scope="col" role="columnheader">Équipement</th>
                    <th scope="col" role="columnheader">Type</th>
                    <th scope="col" role="columnheader">Salle</th>
                    <th scope="col" role="columnheader">État</th>
                    <th scope="col" role="columnheader">Mobilité</th>
                    <th scope="col" role="columnheader">Détails</th>
                </tr>
                </thead>
                <tbody role="rowgroup">
                <tr role="row" th:each="equipement : ${equipements}">
                    <th scope="row" role="rowheader">
                        <span th:text="${equipement.nom}"></span>
                        <span class="block text-xs font-normal text-ws-muted" th:text="${equipement.reference}"></span>
                    </th>
                    <td role="cell">
                        <span aria-hidden="true" class="ws-cell-label">Type</span>
                        <span th:text="${equipement.typeEquipementNom}"></span>
                    </td>
                    <td role="cell">
                        <span aria-hidden="true" class="ws-cell-label">Salle</span>
                        <span th:text="${equipement.salleNom == null ? 'Non affecté' : equipement.salleNom}"></span>
                    </td>
                    <td role="cell">
                        <span aria-hidden="true" class="ws-cell-label">État</span>
                        <span th:text="${equipement.etat.libelle}"></span>
                    </td>
                    <td role="cell">
                        <span aria-hidden="true" class="ws-cell-label">Mobilité</span>
                        <span th:text="${equipement.mobilite.libelle}"></span>
                    </td>
                    <td role="cell">
                        <span aria-hidden="true" class="ws-cell-label">Détails</span>
                        <a th:href="@{/equipements/{id}(id=${equipement.id})}" class="ws-link-inline">Consulter</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <p th:if="${equipements.isEmpty()}" class="p-ws-xxl text-center">
            <span class="ws-section-title block">Aucun équipement trouvé</span>
            <span class="mt-2 block text-ws-muted" th:if="${!#strings.isEmpty(q) or etat != null}">Essayez un autre nom ou modifiez l’état sélectionné.</span>
        </p>
    </section>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Créer un compte — WorkSpace Lite</title>
</head>
<body class="ws-body">
<th:block th:replace="~{fragments/navigation :: header(false, 'inscription')}"></th:block>

<main id="contenu" tabindex="-1" class="ws-page max-w-ws-form">
    <h1 class="ws-page-title">Créer un compte employé</h1>
    <form class="ws-panel grid gap-ws-lg p-ws-lg sm:p-ws-xl" th:action="@{/inscription}" th:object="${inscription}" method="post">
        <p role="alert" class="ws-alert" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
        <div>
            <label class="ws-label" for="nom">Nom</label>
            <input class="ws-field" id="nom" th:field="*{nom}" th:errorclass="ws-field-invalid"
                   th:attr="aria-invalid=${#fields.hasErrors('nom')},aria-describedby=${#fields.hasErrors('nom') ? 'nom-error' : null}" autocomplete="family-name" required>
            <p id="nom-error" class="ws-field-error" th:errors="*{nom}"></p>
        </div>
        <div>
            <label class="ws-label" for="prenom">Prénom</label>
            <input class="ws-field" id="prenom" th:field="*{prenom}" th:errorclass="ws-field-invalid"
                   th:attr="aria-invalid=${#fields.hasErrors('prenom')},aria-describedby=${#fields.hasErrors('prenom') ? 'prenom-error' : null}" autocomplete="given-name" required>
            <p id="prenom-error" class="ws-field-error" th:errors="*{prenom}"></p>
        </div>
        <div>
            <label class="ws-label" for="email">Email</label>
            <input class="ws-field" id="email" type="email" th:field="*{email}" th:errorclass="ws-field-invalid"
                   th:attr="aria-invalid=${#fields.hasErrors('email')},aria-describedby=${#fields.hasErrors('email') ? 'email-error' : null}" autocomplete="email" required>
            <p id="email-error" class="ws-field-error" th:errors="*{email}"></p>
        </div>
        <div>
            <label class="ws-label" for="telephone">Téléphone</label>
            <input class="ws-field" id="telephone" type="tel" th:field="*{telephone}" th:errorclass="ws-field-invalid"
                   th:attr="aria-invalid=${#fields.hasErrors('telephone')},aria-describedby=${#fields.hasErrors('telephone') ? 'telephone-error' : null}" autocomplete="tel">
            <p id="telephone-error" class="ws-field-error" th:errors="*{telephone}"></p>
        </div>
        <div>
            <label class="ws-label" for="motDePasse">Mot de passe (8 caractères minimum)</label>
            <input class="ws-field" id="motDePasse" type="password" th:field="*{motDePasse}" th:errorclass="ws-field-invalid"
                   th:attr="aria-invalid=${#fields.hasErrors('motDePasse')},aria-describedby=${#fields.hasErrors('motDePasse') ? 'motDePasse-error' : null}" autocomplete="new-password" minlength="8" required>
            <p id="motDePasse-error" class="ws-field-error" th:errors="*{motDePasse}"></p>
        </div>
        <div>
            <label class="ws-label" for="confirmation">Confirmer le mot de passe</label>
            <input class="ws-field" id="confirmation" type="password" th:field="*{confirmation}" th:errorclass="ws-field-invalid"
                   th:attr="aria-invalid=${#fields.hasErrors('confirmation')},aria-describedby=${#fields.hasErrors('confirmation') ? 'confirmation-error' : null}" autocomplete="new-password" required>
            <p id="confirmation-error" class="ws-field-error" th:errors="*{confirmation}"></p>
        </div>
        <button class="ws-pill ws-pill-primary w-full" type="submit">Créer mon compte</button>
    </form>
    <div class="flex flex-wrap justify-between gap-ws-sm text-ws-small">
        <a class="ws-link-inline" th:href="@{/connexion}">J’ai déjà un compte</a>
        <a class="ws-link-inline" th:href="@{/}">Retour à l’accueil</a>
    </div>
</main>
</body>
</html>

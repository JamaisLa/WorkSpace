<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Connexion — WorkSpace</title>
</head>
<body class="ws-body">
<th:block th:replace="~{fragments/navigation :: header(false, 'connexion')}"></th:block>

<main id="contenu" tabindex="-1" class="ws-page max-w-ws-form">
    <h1 class="ws-page-title">Se connecter</h1>
    <p role="status" class="ws-status" th:if="${param.inscription}">Compte créé. Tu peux te connecter.</p>
    <p role="alert" class="ws-alert" th:if="${param.error}">Identifiant ou mot de passe incorrect.</p>
    <form class="ws-panel grid gap-ws-lg p-ws-lg sm:p-ws-xl" th:action="@{/connexion}" method="post">
        <div>
            <label class="ws-label" for="identifiant">Email ou identifiant</label>
            <input class="ws-field" id="identifiant" name="identifiant" autocomplete="username" required>
        </div>
        <div>
            <label class="ws-label" for="motDePasse">Mot de passe</label>
            <input class="ws-field" id="motDePasse" name="motDePasse" type="password" autocomplete="current-password" required>
        </div>
        <button class="ws-pill ws-pill-primary w-full" type="submit">Se connecter</button>
    </form>
    <div class="flex flex-wrap justify-between gap-ws-sm text-ws-small">
        <a class="ws-link-inline" th:href="@{/inscription}">Créer un compte employé</a>
        <a class="ws-link-inline" th:href="@{/}">Retour à l’accueil</a>
    </div>
</main>

<footer th:replace="~{fragments/footer :: credits}"></footer>
</body>
</html>

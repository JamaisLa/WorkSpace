<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Connexion — WorkSpace Lite</title>
</head>
<body class="min-h-screen bg-slate-50 p-8 text-slate-900">
<main class="mx-auto max-w-xl">
    <h1 class="text-3xl font-bold text-blue-600">Se connecter</h1>
    <p th:if="${param.inscription}">Compte créé. Tu peux te connecter.</p>
    <p th:if="${param.error}">Identifiant ou mot de passe incorrect.</p>
    <form th:action="@{/connexion}" method="post">
        <div>
            <label for="identifiant">Email ou identifiant</label>
            <input id="identifiant" name="identifiant" autocomplete="username" required>
        </div>
        <div>
            <label for="motDePasse">Mot de passe</label>
            <input id="motDePasse" name="motDePasse" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit">Se connecter</button>
    </form>
    <p><a th:href="@{/inscription}">Créer un compte employé</a></p>
    <p><a th:href="@{/}">Retour à l’accueil</a></p>
</main>
</body>
</html>

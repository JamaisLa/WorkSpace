<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Détails de la salle</title>
</head>
<body class="ws-body">
<th:block th:replace="~{fragments/navigation :: header(true, 'salles')}"></th:block>

<main id="contenu" tabindex="-1" class="ws-page">
    <p th:if="${success}" th:text="${success}" role="status" class="ws-status"></p>
    <a th:href="@{/salles}" class="ws-link-inline text-sm">Retour aux salles</a>
    <div class="ws-page-heading">
        <div class="min-w-0">
            <h1 class="ws-page-title break-words" th:text="${salle.nom}"></h1>
            <p class="mt-3 break-words text-ws-muted" th:text="${salle.localisation}"></p>
        </div>
        <a th:if="${admin}" th:href="@{/salles/{id}/modifier(id=${salle.id})}" class="ws-pill ws-pill-primary">Modifier la salle</a>
    </div>
    <section class="ws-panel p-6 sm:p-8" aria-labelledby="informations-title">
        <h2 id="informations-title" class="ws-section-title">Informations de la salle</h2>
        <dl class="mt-6 grid gap-6 sm:grid-cols-2">
            <div><dt class="text-sm text-ws-muted">Capacité d’accueil</dt><dd class="mt-2 text-2xl font-semibold"><span th:text="${salle.capacite}"></span> <span class="text-base font-normal text-ws-muted">personnes</span></dd></div>
            <div><dt class="text-sm text-ws-muted">Localisation</dt><dd class="mt-2 break-words font-medium" th:text="${salle.localisation}"></dd></div>
        </dl>
    </section>
    <a th:if="${admin}" th:href="@{/salles/{id}/supprimer(id=${salle.id})}" class="ws-pill ws-pill-secondary">Supprimer la salle</a>
</main>

<footer th:replace="~{fragments/footer :: credits}"></footer>
</body>
</html>

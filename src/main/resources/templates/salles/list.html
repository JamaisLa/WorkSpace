<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/salles.css}">
    <title>Salles</title>
</head>
<body class="min-h-screen bg-slate-100 px-4 py-8 font-sans text-slate-800">
<main class="room-page space-y-7">
    <p th:if="${success}" th:text="${success}" role="status" class="room-success"></p>
    <a th:href="@{/}" class="text-link text-sm">Retour à l’accueil</a>
    <div class="flex flex-wrap items-start justify-between gap-5">
        <div>
            <h1 class="page-title">Salles de réunion</h1>
            <p class="mt-3 text-slate-500">Trouvez le bon espace pour votre équipe.</p>
        </div>
        <a th:if="${admin}" th:href="@{/salles/nouveau}" class="btn-primary">Ajouter une salle</a>
    </div>
    <section class="panel overflow-hidden" aria-label="Recherche et liste des salles">
        <form method="get" th:action="@{/salles}" class="grid gap-4 border-b border-slate-200 p-5 sm:grid-cols-[1fr_10rem_auto] sm:items-end sm:p-6">
            <div>
                <label for="q" class="field-label">Nom de la salle</label>
                <input id="q" name="q" type="search" placeholder="Rechercher une salle…" th:value="${q}" class="field">
            </div>
            <div>
                <label for="capaciteMin" class="field-label">Capacité minimale</label>
                <input id="capaciteMin" name="capaciteMin" type="number" min="0" step="1" th:value="${capaciteMin > 0 ? capaciteMin : ''}" placeholder="Toutes" class="field">
            </div>
            <div class="flex items-center gap-3">
                <button type="submit" class="btn-secondary">Rechercher</button>
                <a th:if="${!#strings.isEmpty(q) or capaciteMin > 0}" th:href="@{/salles}" class="text-link text-sm">Effacer</a>
            </div>
        </form>
        <div th:if="${!salles.isEmpty()}" class="overflow-x-auto">
            <table class="w-full text-left text-sm">
                <caption class="border-b border-slate-100 px-6 py-4 text-left text-sm text-slate-500" th:text="${salles.size()} + (${salles.size() == 1} ? ' salle trouvée' : ' salles trouvées')">Salles trouvées</caption>
                <thead class="border-b border-slate-200 bg-slate-50 text-slate-500">
                <tr>
                    <th scope="col" class="px-6 py-3 font-medium">Salle</th>
                    <th scope="col" class="px-6 py-3 font-medium">Localisation</th>
                    <th scope="col" class="px-6 py-3 font-medium">Capacité</th>
                    <th th:if="${admin}" scope="col" class="px-6 py-3 text-right font-medium">Actions</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                <tr th:each="salle : ${salles}" class="hover:bg-slate-50">
                    <th scope="row" class="max-w-xs px-6 py-5 font-semibold break-words"><a th:href="@{/salles/{id}(id=${salle.id})}" class="text-link" th:text="${salle.nom}"></a></th>
                    <td class="max-w-xs px-6 py-5 text-slate-500 break-words" th:text="${salle.localisation}"></td>
                    <td class="px-6 py-5"><span class="inline-flex whitespace-nowrap rounded-md bg-blue-50 px-2.5 py-1 font-medium text-blue-700" th:text="${salle.capacite} + ' pers.'"></span></td>
                    <td th:if="${admin}" class="px-6 py-5 text-right"><a th:if="${admin}" th:href="@{/salles/{id}/modifier(id=${salle.id})}" class="text-link" th:attr="aria-label='Modifier ' + ${salle.nom}">Modifier</a></td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${salles.isEmpty()}" class="px-6 py-16 text-center">
            <div class="mx-auto mb-5 flex size-14 items-center justify-center rounded-2xl bg-blue-50 text-blue-600" aria-hidden="true">
                <svg class="size-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 21V7h7v14m-3-7h1"/></svg>
            </div>
            <h2 class="text-xl font-semibold" th:text="${!#strings.isEmpty(q) or capaciteMin > 0} ? 'Aucune salle ne correspond' : 'Aucune salle enregistrée'">Aucune salle</h2>
            <p class="mx-auto mt-3 max-w-md leading-6 text-slate-500" th:text="${!#strings.isEmpty(q) or capaciteMin > 0} ? 'Essayez un autre nom ou réduisez la capacité minimale.' : 'Les salles seront affichées ici dès leur ajout.'"></p>
            <a th:if="${admin}" th:href="@{/salles/nouveau}" class="btn-primary mt-6">Ajouter une salle</a>
        </div>
    </section>
</main>
</body>
</html>

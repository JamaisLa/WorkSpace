<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Salles</title>
</head>
<body class="ws-body">
<th:block th:replace="~{fragments/navigation :: header(true, 'salles')}"></th:block>

<main id="contenu" tabindex="-1" class="ws-page">
    <p th:if="${success}" th:text="${success}" role="status" class="ws-status"></p>
    <div class="ws-page-heading">
        <div>
            <h1 class="ws-page-title">Salles de réunion</h1>
            <p class="mt-3 text-ws-muted">Trouvez le bon espace pour votre équipe.</p>
        </div>
        <a th:if="${admin}" th:href="@{/salles/nouveau}" class="ws-pill ws-pill-primary">Ajouter une salle</a>
    </div>
    <section class="ws-panel overflow-clip" aria-label="Recherche et liste des salles">
        <form method="get" th:action="@{/salles}" class="grid gap-4 border-b border-ws-line p-5 ws-tablet:grid-cols-[minmax(0,1fr)_10rem_auto] ws-tablet:items-end sm:p-6">
            <div>
                <label for="q" class="ws-label">Nom de la salle</label>
                <input id="q" name="q" type="search" placeholder="Rechercher une salle…" th:value="${q}" class="ws-field">
            </div>
            <div>
                <label for="capaciteMin" class="ws-label">Capacité minimale</label>
                <input id="capaciteMin" name="capaciteMin" type="number" min="0" step="1" th:value="${capaciteMin > 0 ? capaciteMin : ''}" placeholder="Toutes" class="ws-field">
            </div>
            <div class="flex flex-wrap items-center gap-ws-sm">
                <button type="submit" class="ws-pill ws-pill-secondary">Rechercher</button>
                <a th:if="${!#strings.isEmpty(q) or capaciteMin > 0}" th:href="@{/salles}" class="ws-link-inline text-sm">Effacer</a>
            </div>
        </form>
        <div th:if="${!salles.isEmpty()}">
            <table class="ws-table" role="table">
                <caption class="border-b border-ws-line-soft px-6 py-4 text-left text-ws-small text-ws-muted" th:text="${salles.size()} + (${salles.size() == 1} ? ' salle trouvée' : ' salles trouvées')">Salles trouvées</caption>
                <thead role="rowgroup">
                <tr role="row">
                    <th scope="col" role="columnheader">Salle</th>
                    <th scope="col" role="columnheader">Localisation</th>
                    <th scope="col" role="columnheader">Capacité</th>
                    <th th:if="${admin}" scope="col" role="columnheader" class="ws-tablet:text-right">Actions</th>
                </tr>
                </thead>
                <tbody role="rowgroup">
                <tr role="row" th:each="salle : ${salles}">
                    <th scope="row" role="rowheader"><a th:href="@{/salles/{id}(id=${salle.id})}" class="ws-link-inline" th:text="${salle.nom}"></a></th>
                    <td role="cell">
                        <span aria-hidden="true" class="ws-cell-label">Localisation</span>
                        <span th:text="${salle.localisation}"></span>
                    </td>
                    <td role="cell">
                        <span aria-hidden="true" class="ws-cell-label">Capacité</span>
                        <span class="ws-chip" th:text="${salle.capacite} + ' pers.'"></span>
                    </td>
                    <td role="cell" th:if="${admin}" class="ws-tablet:text-right">
                        <span aria-hidden="true" class="ws-cell-label">Actions</span>
                        <a th:if="${admin}" th:href="@{/salles/{id}/modifier(id=${salle.id})}" class="ws-link-inline" th:attr="aria-label='Modifier ' + ${salle.nom}">Modifier</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${salles.isEmpty()}" class="px-6 py-16 text-center">
            <div class="mx-auto mb-5 flex size-14 items-center justify-center rounded-ws-card bg-ws-raised text-ws-ink" aria-hidden="true">
                <svg class="size-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 21V7h7v14m-3-7h1"/></svg>
            </div>
            <h2 class="ws-section-title" th:text="${!#strings.isEmpty(q) or capaciteMin > 0} ? 'Aucune salle ne correspond' : 'Aucune salle enregistrée'">Aucune salle</h2>
            <p class="mx-auto mt-3 max-w-md leading-6 text-ws-muted" th:text="${!#strings.isEmpty(q) or capaciteMin > 0} ? 'Essayez un autre nom ou réduisez la capacité minimale.' : 'Les salles seront affichées ici dès leur ajout.'"></p>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: credits}"></footer>
</body>
</html>

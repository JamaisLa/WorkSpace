<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/salles.css}">
    <title th:text="${modification ? 'Modifier le type' : 'Ajouter un type'}">Type d’équipement</title>
</head>
<body class="min-h-screen bg-slate-100 px-4 py-8 font-sans text-slate-800">
<main class="room-page max-w-2xl space-y-6">
    <a th:href="@{/types-equipement}" class="text-link text-sm">Retour aux types</a>
    <h1 class="page-title" th:text="${modification ? 'Modifier le type' : 'Ajouter un type'}"></h1>
    <form method="post"
          th:action="${modification} ? @{/types-equipement/{id}(id=${typeId})} : @{/types-equipement}"
          th:object="${typeEquipementForm}" class="panel p-6 sm:p-8">
        <label for="nom" class="field-label">Nom du type (obligatoire)</label>
        <input id="nom" th:field="*{nom}" type="text" required maxlength="100"
               placeholder="Ex. Vidéoprojecteur" class="field" th:errorclass="field-invalid"
               th:attr="aria-invalid=${#fields.hasErrors('nom')},aria-describedby=${#fields.hasErrors('nom') ? 'nom-error' : null}">
        <p id="nom-error" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}" class="field-error" role="alert"></p>
        <div th:if="${#fields.hasAnyErrors()}" role="alert" class="mt-4 text-sm text-red-800">
            Vérifiez le nom indiqué.
        </div>
        <div class="mt-8 flex flex-wrap gap-3 border-t border-slate-200 pt-6">
            <button type="submit" class="btn-primary" th:text="${modification ? 'Enregistrer' : 'Créer le type'}"></button>
            <a th:href="@{/types-equipement}" class="btn-secondary">Annuler</a>
        </div>
    </form>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/salles.css}">
    <title>Types d’équipement</title>
</head>
<body class="min-h-screen bg-slate-100 px-4 py-8 font-sans text-slate-800">
<main class="room-page space-y-7">
    <a th:href="@{/}" class="text-link text-sm">Retour à l’accueil</a>
    <p th:if="${success}" th:text="${success}" role="status" class="room-success"></p>
    <div class="flex flex-wrap items-start justify-between gap-5">
        <div>
            <h1 class="page-title">Types d’équipement</h1>
            <p class="mt-3 text-slate-500">Consultez les catégories de matériel.</p>
        </div>
        <a th:if="${admin}" th:href="@{/types-equipement/nouveau}" class="btn-primary">Ajouter un type</a>
    </div>
    <section class="panel overflow-hidden" aria-label="Liste des types d’équipement">
        <div th:if="${!types.isEmpty()}" class="overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-50 text-slate-500">
                <tr><th scope="col" class="px-6 py-4 font-medium">Nom</th><th scope="col" class="px-6 py-4 font-medium">Actions</th></tr>
                </thead>
                <tbody class="divide-y divide-slate-200">
                <tr th:each="type : ${types}">
                    <th scope="row" class="px-6 py-5 font-semibold" th:text="${type.nom}"></th>
                    <td class="px-6 py-5">
                        <div th:if="${admin}" class="flex flex-wrap gap-3">
                            <a th:href="@{/types-equipement/{id}/modifier(id=${type.id})}" class="text-link">Modifier</a>
                            <a th:href="@{/types-equipement/{id}/supprimer(id=${type.id})}" class="text-link">Supprimer</a>
                        </div>
                        <span th:unless="${admin}" class="text-slate-500">Consultation</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <p th:if="${types.isEmpty()}" class="p-6 text-slate-500">Aucun type d’équipement pour le moment.</p>
    </section>
</main>
</body>
</html>

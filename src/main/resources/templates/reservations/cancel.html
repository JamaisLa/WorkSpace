<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Annuler une réservation — WorkSpace Lite</title>
</head>
<body class="ws-body">
<th:block th:replace="~{fragments/navigation :: header(true, 'reservations')}"></th:block>

<main id="contenu" tabindex="-1" class="ws-page max-w-ws-form">
    <h1 class="ws-page-title">Annuler cette réservation ?</h1>
    <section class="ws-panel p-6 sm:p-8" aria-label="Confirmation d’annulation">
        <p class="leading-7 text-ws-muted">
            Vous allez annuler <strong th:text="${reservation.objet}"></strong>
            dans la salle <strong th:text="${reservation.salle}"></strong>,
            du <span th:text="${reservation.dateDebut}"></span>
            au <span th:text="${reservation.dateFin}"></span>.
        </p>
        <form method="post" th:action="@{/reservations/{id}/annuler(id=${reservation.id})}" class="mt-7 ws-actions">
            <button type="submit" class="ws-pill ws-pill-secondary">Confirmer l’annulation</button>
            <a th:href="@{/reservations/{id}(id=${reservation.id})}" class="ws-pill ws-pill-primary">Garder la réservation</a>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/footer :: credits}"></footer>
</body>
</html>

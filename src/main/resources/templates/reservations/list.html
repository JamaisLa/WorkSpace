<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/salles.css}">
    <title>Mes réservations — WorkSpace Lite</title>
</head>
<body class="site-body">
<main class="room-page space-y-7">
    <a th:href="@{/}" class="text-link text-sm">Retour à l’accueil</a>
    <div class="flex flex-wrap items-center justify-between gap-5">
        <div>
            <h1 class="page-title">Mes réservations</h1>
            <p class="mt-3 text-slate-500">Consultez vos réservations de salles.</p>
        </div>
        <a th:href="@{/reservations/nouvelle}" class="btn-primary">Réserver une salle</a>
    </div>
    <p th:if="${success}" th:text="${success}" role="status" class="room-success"></p>
    <section class="panel overflow-hidden" th:if="${!#lists.isEmpty(reservations)}" aria-label="Liste des réservations">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-50 text-slate-600">
                <tr>
                    <th scope="col" class="px-5 py-4 font-semibold">Objet</th>
                    <th scope="col" class="px-5 py-4 font-semibold">Salle</th>
                    <th scope="col" class="px-5 py-4 font-semibold">Début</th>
                    <th scope="col" class="px-5 py-4 font-semibold">Fin</th>
                    <th scope="col" class="px-5 py-4 font-semibold">Participants</th>
                    <th scope="col" class="px-5 py-4 font-semibold">Équipements</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-200">
                <tr th:each="reservation : ${reservations}" class="align-top">
                    <th scope="row" class="px-5 py-4 font-semibold">
                        <a class="text-link" th:href="@{/reservations/{id}(id=${reservation.id})}"
                           th:text="${reservation.objet}"></a>
                    </th>
                    <td class="px-5 py-4" th:text="${reservation.salle}"></td>
                    <td class="whitespace-nowrap px-5 py-4" th:text="${reservation.dateDebut}"></td>
                    <td class="whitespace-nowrap px-5 py-4" th:text="${reservation.dateFin}"></td>
                    <td class="px-5 py-4" th:text="${reservation.nombreParticipants}"></td>
                    <td class="px-5 py-4">
                        <span th:if="${#lists.isEmpty(reservation.equipements)}">Aucun</span>
                        <span th:unless="${#lists.isEmpty(reservation.equipements)}" th:text="${#strings.listJoin(reservation.equipements, ', ')}"></span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
    <section th:if="${#lists.isEmpty(reservations)}" class="panel grid justify-items-center gap-3 p-8 text-center">
        <h2 class="text-lg font-semibold text-slate-900">Aucune réservation pour le moment</h2>
        <p class="text-slate-600">Créez une réservation pour choisir une salle et son créneau.</p>
        <a th:href="@{/reservations/nouvelle}" class="btn-primary mt-2">Réserver une salle</a>
    </section>
</main>
</body>
</html>

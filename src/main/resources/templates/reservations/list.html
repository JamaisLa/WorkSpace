<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Mes réservations — WorkSpace Lite</title>
</head>
<body class="ws-body">
<th:block th:replace="~{fragments/navigation :: header(true, 'reservations')}"></th:block>

<main id="contenu" tabindex="-1" class="ws-page">
    <div class="ws-page-heading">
        <div>
            <h1 class="ws-page-title">Mes réservations</h1>
            <p class="mt-3 text-ws-muted">Consultez vos réservations de salles.</p>
        </div>
        <a th:unless="${#lists.isEmpty(reservations)}" th:href="@{/reservations/nouvelle}" class="ws-pill ws-pill-primary">Réserver une salle</a>
    </div>
    <p th:if="${success}" th:text="${success}" role="status" class="ws-status"></p>
    <section class="ws-panel overflow-clip" th:if="${!#lists.isEmpty(reservations)}" aria-label="Liste des réservations">
        <div>
            <table class="ws-table" role="table">
                <thead role="rowgroup">
                <tr role="row">
                    <th scope="col" role="columnheader">Objet</th>
                    <th scope="col" role="columnheader">Salle</th>
                    <th scope="col" role="columnheader">Début</th>
                    <th scope="col" role="columnheader">Fin</th>
                    <th scope="col" role="columnheader">Participants</th>
                    <th scope="col" role="columnheader">Équipements</th>
                </tr>
                </thead>
                <tbody role="rowgroup">
                <tr role="row" th:each="reservation : ${reservations}">
                    <th scope="row" role="rowheader">
                        <a class="ws-link-inline" th:href="@{/reservations/{id}(id=${reservation.id})}"
                           th:text="${reservation.objet}"></a>
                    </th>
                    <td role="cell">
                        <span aria-hidden="true" class="ws-cell-label">Salle</span>
                        <span th:text="${reservation.salle}"></span>
                    </td>
                    <td role="cell">
                        <span aria-hidden="true" class="ws-cell-label">Début</span>
                        <span th:text="${reservation.dateDebut}"></span>
                    </td>
                    <td role="cell">
                        <span aria-hidden="true" class="ws-cell-label">Fin</span>
                        <span th:text="${reservation.dateFin}"></span>
                    </td>
                    <td role="cell">
                        <span aria-hidden="true" class="ws-cell-label">Participants</span>
                        <span th:text="${reservation.nombreParticipants}"></span>
                    </td>
                    <td role="cell">
                        <span aria-hidden="true" class="ws-cell-label">Équipements</span>
                        <div class="min-w-0">
                            <span th:if="${#lists.isEmpty(reservation.equipements)}">Aucun</span>
                            <span th:unless="${#lists.isEmpty(reservation.equipements)}" th:text="${#strings.listJoin(reservation.equipements, ', ')}"></span>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
    <section th:if="${#lists.isEmpty(reservations)}" class="ws-panel grid justify-items-center gap-3 p-8 text-center">
        <h2 class="ws-section-title text-ws-ink">Aucune réservation pour le moment</h2>
        <p class="text-ws-muted">Créez une réservation pour choisir une salle et son créneau.</p>
        <a th:href="@{/reservations/nouvelle}" class="ws-pill ws-pill-primary mt-2">Réserver une salle</a>
    </section>
</main>
</body>
</html>

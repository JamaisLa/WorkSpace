<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Réserver une salle — WorkSpace Lite</title>
</head>
<body class="ws-body">
<th:block th:replace="~{fragments/navigation :: header(true, 'reservations')}"></th:block>

<main id="contenu" tabindex="-1" class="ws-page max-w-ws-form">
    <a th:href="@{/reservations}" class="ws-link-inline text-sm">Retour à mes réservations</a>
    <h1 class="ws-page-title">Nouvelle réservation</h1>
    <form method="post" th:action="@{/reservations}" th:object="${reservationForm}"
          class="ws-panel grid gap-5 p-6 sm:p-8">
        <div th:if="${#fields.hasGlobalErrors()}" role="alert" class="ws-alert">
            <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
        </div>
        <div>
            <label for="objet" class="ws-label">Objet de la réunion</label>
            <input id="objet" th:field="*{objet}" class="ws-field" th:errorclass="ws-field-invalid" maxlength="200" required>
            <p th:errors="*{objet}" class="ws-field-error"></p>
        </div>
        <div>
            <label for="salleId" class="ws-label">Salle</label>
            <select id="salleId" th:field="*{salleId}" class="ws-field" th:errorclass="ws-field-invalid" required>
                <option value="">Choisir une salle</option>
                <option th:each="salle : ${salles}" th:value="${salle.id}"
                        th:text="${salle.nom + ' (' + salle.capacite + ' places)'}">
                </option>
            </select>
            <p th:errors="*{salleId}" class="ws-field-error"></p>
        </div>
        <div class="grid gap-4 sm:grid-cols-2">
            <div>
                <label for="dateDebut" class="ws-label">Début</label>
                <input id="dateDebut" type="datetime-local" th:field="*{dateDebut}"
                       class="ws-field" th:errorclass="ws-field-invalid" required>
                <p th:errors="*{dateDebut}" class="ws-field-error"></p>
            </div>
            <div>
                <label for="dateFin" class="ws-label">Fin</label>
                <input id="dateFin" type="datetime-local" th:field="*{dateFin}"
                       class="ws-field" th:errorclass="ws-field-invalid" required>
                <p th:errors="*{dateFin}" class="ws-field-error"></p>
            </div>
        </div>
        <div>
            <label for="nombreParticipants" class="ws-label">Nombre de participants</label>
            <input id="nombreParticipants" type="number" min="1" step="1" th:field="*{nombreParticipants}"
                   class="ws-field sm:max-w-48" th:errorclass="ws-field-invalid" required>
            <p th:errors="*{nombreParticipants}" class="ws-field-error"></p>
        </div>
        <fieldset class="grid gap-3">
            <legend class="ws-label">Équipements mobiles (facultatif)</legend>
            <p class="text-sm text-ws-muted">Seuls les équipements mobiles hors maintenance sont proposés ; leur disponibilité dépend du créneau choisi.</p>
            <p th:if="${#lists.isEmpty(equipements)}" class="text-sm text-ws-muted">Aucun équipement réservable.</p>
            <label th:each="equipement : ${equipements}"
                   class="flex items-center gap-3 rounded-lg border border-ws-line px-4 py-3 hover:bg-ws-raised">
                <input type="checkbox" th:field="*{equipementIds}" th:value="${equipement.id}"
                       class="size-4 accent-ws-accent focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-ws-accent">
                <span class="font-medium" th:text="${equipement.nom}"></span>
            </label>
        </fieldset>
        <div class="ws-actions border-t border-ws-line pt-6">
            <button type="submit" class="ws-pill ws-pill-primary">Créer la réservation</button>
            <a th:href="@{/reservations}" class="ws-pill ws-pill-secondary">Annuler</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/footer :: credits}"></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Détail de la réservation — WorkSpace</title>
</head>
<body class="ws-body">
<th:block th:replace="~{fragments/navigation :: header(true, 'reservations')}"></th:block>

<main id="contenu" tabindex="-1" class="ws-page">
    <a th:href="@{/reservations}" class="ws-link-inline text-sm">Retour à mes réservations</a>
    <h1 class="ws-page-title" th:text="${reservation.objet}"></h1>
    <dl class="ws-panel grid gap-ws-lg p-ws-lg sm:grid-cols-2 sm:p-ws-xl">
        <div>
            <dt class="text-ws-small text-ws-muted">Salle</dt>
            <dd class="mt-1 font-medium" th:text="${reservation.salle}"></dd>
        </div>
        <div>
            <dt class="text-ws-small text-ws-muted">Début</dt>
            <dd class="mt-1 font-medium" th:text="${reservation.dateDebut}"></dd>
        </div>
        <div>
            <dt class="text-ws-small text-ws-muted">Fin</dt>
            <dd class="mt-1 font-medium" th:text="${reservation.dateFin}"></dd>
        </div>
        <div>
            <dt class="text-ws-small text-ws-muted">Participants</dt>
            <dd class="mt-1 font-medium" th:text="${reservation.nombreParticipants}"></dd>
        </div>
        <div>
            <dt class="text-ws-small text-ws-muted">Équipements</dt>
            <dd class="mt-1 font-medium" th:text="${#lists.isEmpty(reservation.equipements) ? 'Aucun' : #strings.listJoin(reservation.equipements, ', ')}"></dd>
        </div>
    </dl>
    <a th:href="@{/reservations/{id}/annuler(id=${reservation.id})}" class="ws-pill ws-pill-secondary">Annuler la réservation</a>
</main>

<footer th:replace="~{fragments/footer :: credits}"></footer>
</body>
</html>

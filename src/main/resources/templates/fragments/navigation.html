<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="header(signedIn, section)">
<a href="#contenu" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-30 focus:rounded-ws-pill focus:bg-ws-primary focus:px-ws-md focus:py-2 focus:text-ws-on-primary">Aller au contenu</a>

<header class="sticky top-0 z-20 border-b border-ws-line-soft bg-ws-canvas">
    <div class="ws-container relative flex min-h-ws-nav items-center justify-between gap-ws-sm text-ws-small font-medium ws-tablet:grid ws-tablet:grid-cols-[1fr_auto_1fr]">
        <a class="ws-link font-ws-display text-lg font-ws-display-medium ws-tablet:justify-self-start" th:href="@{/}" th:attr="aria-current=${section == 'accueil' ? 'page' : null}">WorkSpace Lite</a>

        <nav th:if="${signedIn}" class="hidden items-center gap-ws-lg ws-tablet:flex" aria-label="Navigation principale">
            <a class="ws-link" th:href="@{/salles}" th:attr="aria-current=${section == 'salles' ? 'location' : null}">Salles</a>
            <a class="ws-link" th:href="@{/equipements}" th:attr="aria-current=${section == 'equipements' ? 'location' : null}">Équipements</a>
            <a class="ws-link" th:href="@{/reservations}" th:attr="aria-current=${section == 'reservations' ? 'location' : null}">Mes réservations</a>
            <a class="ws-link" th:href="@{/profil}" th:attr="aria-current=${section == 'profil' ? 'location' : null}">Mon profil</a>
        </nav>

        <div th:unless="${signedIn}" class="flex items-center gap-ws-sm ws-tablet:col-start-3 ws-tablet:justify-self-end">
            <a th:unless="${section == 'connexion'}" class="ws-pill ws-pill-secondary"
               th:classappend="${section == 'accueil'} ? 'hidden ws-tablet:inline-flex' : ''" th:href="@{/connexion}">Se connecter</a>
            <a th:unless="${section == 'inscription'}" class="ws-pill ws-pill-primary" th:href="@{/inscription}">Créer un compte</a>
        </div>

        <form th:if="${signedIn}" class="hidden ws-tablet:col-start-3 ws-tablet:block ws-tablet:justify-self-end" th:action="@{/logout}" method="post">
            <button class="ws-pill ws-pill-secondary" type="submit">Se déconnecter</button>
        </form>

        <details th:if="${signedIn}" class="ws-tablet:hidden">
            <summary class="ws-pill ws-pill-secondary gap-2 list-none [&::-webkit-details-marker]:hidden">
                <span class="grid w-4 gap-1" aria-hidden="true"><span class="h-px bg-current"></span><span class="h-px bg-current"></span></span>
                Menu
            </summary>
            <nav class="absolute inset-x-ws-lg top-full mt-2 grid gap-1 rounded-ws-card border border-ws-line bg-ws-surface p-ws-sm shadow-ws-floating" aria-label="Navigation principale">
                <a class="ws-link flex min-h-ws-target items-center px-ws-sm" th:href="@{/salles}" th:attr="aria-current=${section == 'salles' ? 'location' : null}">Salles</a>
                <a class="ws-link flex min-h-ws-target items-center px-ws-sm" th:href="@{/equipements}" th:attr="aria-current=${section == 'equipements' ? 'location' : null}">Équipements</a>
                <a class="ws-link flex min-h-ws-target items-center px-ws-sm" th:href="@{/reservations}" th:attr="aria-current=${section == 'reservations' ? 'location' : null}">Mes réservations</a>
                <a class="ws-link flex min-h-ws-target items-center px-ws-sm" th:href="@{/profil}" th:attr="aria-current=${section == 'profil' ? 'location' : null}">Mon profil</a>
                <form class="mt-1 border-t border-ws-line pt-2" th:action="@{/logout}" method="post">
                    <button class="ws-pill ws-pill-secondary w-full" type="submit">Se déconnecter</button>
                </form>
            </nav>
        </details>
    </div>
</header>
</th:block>
</body>
</html>

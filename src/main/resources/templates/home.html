<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>WorkSpace Lite</title>
</head>
<body>
<main>
    <h1>WorkSpace Lite</h1>
    <p>Gérez vos espaces de travail et vos réservations.</p>
    <nav th:unless="${loggedIn}" aria-label="Compte">
        <a class="button-link" th:href="@{/inscription}">Créer un compte</a>
        <a class="button-link" th:href="@{/connexion}">Se connecter</a>
    </nav>
    <div th:if="${loggedIn}">
        <p>Connecté avec <span th:text="${email}"></span></p>
        <form th:action="@{/logout}" method="post">
            <button type="submit">Se déconnecter</button>
        </form>
    </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>WorkSpace Lite</title>
</head>
<body class="site-body">
<main class="site-card site-card-wide">
    <h1 class="site-title site-title-home">WorkSpace Lite</h1>
    <p class="mt-3 max-w-xl leading-7 text-slate-600">Gérez vos espaces de travail et vos réservations.</p>
    <nav class="mt-8 grid gap-3 sm:grid-cols-2" th:unless="${loggedIn}" aria-label="Compte">
        <a class="site-button" th:href="@{/inscription}">Créer un compte</a>
        <a class="site-button" th:href="@{/connexion}">Se connecter</a>
    </nav>
    <div th:if="${loggedIn}" class="mt-8 border-t border-slate-200 pt-6">
        <p class="text-sm text-slate-500">Connecté avec <span class="font-semibold text-slate-800" th:text="${email}"></span></p>
        <nav class="mt-5 grid gap-3 sm:grid-cols-2" aria-label="Navigation principale">
            <a class="site-nav-link" th:href="@{/salles}">Consulter les salles</a>
            <a class="site-nav-link" th:href="@{/equipements}">Consulter les équipements</a>
        </nav>
        <form class="mt-6 flex justify-center border-t border-slate-200 pt-5" th:action="@{/logout}" method="post">
            <button class="site-button-secondary" type="submit">Se déconnecter</button>
        </form>
    </div>
</main>
</body>
</html>
